services:
  - type: web
    name: ecommerce-backend
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_VERSION
        value: v1
      # Add these in Render Dashboard (keep secrets secure):
      # - MONGODB_URI
      # - JWT_SECRET
      # - JWT_REFRESH_SECRET
      # - FRONTEND_URL
      # - ADMIN_URL
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
      # - EMAIL_HOST
      # - EMAIL_PORT
      # - EMAIL_USER
      # - EMAIL_PASS
      # - EMAIL_FROM
